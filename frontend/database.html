  功能名称：数据库连接测试
  功能简介：填写 MySQL 用户名与密码，提交到后端 /api/db-test 接口；
     后端用 mysql2 实际连接一次 MySQL 并返回版本号，页面用绿色（成功）
     或红色（失败）显示结果，同时输出到浏览器控制台。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据库连接测试 · 高级网页设计</title>
  <link rel="stylesheet" href="css/fxc_database.css">
</head>
<body>
  <div class="fxc_shell">

    <a class="fxc_back" href="index.html">← 返回作品首页</a>

    <h1 class="fxc_title">数据库连接测试</h1>
    <p class="fxc_sub">填入 MySQL 账号后点击测试，后端将真实建立一次连接并回传数据库版本。</p>

    <form id="fxc_form" class="fxc_panel" autocomplete="off">
      <div class="fxc_field">
        <label class="fxc_label" for="fxc_user">用户名</label>
        <input class="fxc_input" id="fxc_user" type="text" value="root" spellcheck="false">
      </div>

      <div class="fxc_field">
        <label class="fxc_label" for="fxc_password">密码</label>
        <input class="fxc_input" id="fxc_password" type="password" value="1234567890" spellcheck="false">
      </div>

      <button class="fxc_btn" id="fxc_submit" type="submit">测试连接</button>

      <div class="fxc_result" id="fxc_result" role="status" aria-live="polite"></div>
    </form>

    <p class="fxc_tip">
      接口：<code>POST /api/db-test</code>　请求体：<code>{ "user": "...", "password": "..." }</code><br>
      主机与数据库名由 <code>backend/.env</code> 提供，前端只传账号密码。
    </p>

  </div>

  <script src="js/fxc_database.js"></script>
</body>
</html>
