<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>iconfont 图标资源 - 番茄音乐项目</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #fff;
            padding: 40px 30px;
        }
        .head {
            text-align: center;
            margin-bottom: 34px;
        }
        .head h1 {
            font-size: 30px;
            color: #333;
            letter-spacing: 1px;
        }
        .head p {
            margin-top: 8px;
            color: #888;
            font-size: 14px;
        }
        .proj {
            display: inline-block;
            margin-top: 14px;
            padding: 6px 18px;
            border: 1px solid #ff6b3d;
            color: #ff6b3d;
            border-radius: 20px;
            font-size: 14px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 960px;
            margin: 0 auto;
        }
        .cell {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 26px 10px 18px;
            text-align: center;
            transition: box-shadow .2s;
        }
        .cell:hover { box-shadow: 0 6px 20px rgba(0,0,0,.08); }
        .cell svg {
            width: 52px;
            height: 52px;
            fill: #ff6b3d;
            margin-bottom: 12px;
        }
        .cell .name { font-size: 16px; color: #333; }
        .cell .code {
            margin-top: 6px;
            font-size: 12px;
            color: #aaa;
            background: #f7f7f7;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="head">
        <h1>iconfont 阿里巴巴矢量图标库</h1>
        <p>搜索关键词：home / music / playlist / play / user</p>
        <div class="proj">我的项目：番茄音乐</div>
    </div>
    <div class="grid">
        <div class="cell">
            <svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h5v-5h4v5h5v-8h3L12 3z"/></svg>
            <div class="name">首页</div><div class="code">&#xe600;</div>
        </div>
        <div class="cell">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <div class="name">发现音乐</div><div class="code">&#xe601;</div>
        </div>
        <div class="cell">
            <svg viewBox="0 0 24 24"><path d="M3 6h13v2H3V6zm0 5h13v2H3v-2zm0 5h8v2H3v-2zm16-6.5l4 3.5-4 3.5V9.5z"/></svg>
            <div class="name">歌单</div><div class="code">&#xe602;</div>
        </div>
        <div class="cell">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
            <div class="name">播放</div><div class="code">&#xe603;</div>
        </div>
        <div class="cell">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <div class="name">我的</div><div class="code">&#xe604;</div>
        </div>
    </div>
</body>
</html>
