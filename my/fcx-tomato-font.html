<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄音乐 - 底部导航（字体图标版）</title>
    <!-- 引入字体图标样式 -->
    <link rel="stylesheet" href="./iconfont.css">
    <style>
        /* ============ 全局 CSS（无 id 选择器，类名含姓名缩写 fcx） ============ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #121212;
            color: #e8e8e8;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            padding-bottom: 64px; /* 为固定底部导航留出空间 */
        }

        /* 页面头部 */
        .fcx-header {
            padding: 14px 16px 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fcx-logo {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ff6b3d, #e6302c);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #fff;
            font-weight: bold;
        }
        .fcx-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .fcx-title em {
            color: #ff6b3d;
            font-style: normal;
        }

        /* 轮播占位 */
        .fcx-banner {
            margin: 12px 16px;
            height: 130px;
            border-radius: 14px;
            background: linear-gradient(120deg, #2b1a16, #3a2a1f 55%, #6b2b1e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #ffd9c9;
            letter-spacing: 2px;
        }

        /* 榜单卡片 */
        .fcx-section {
            padding: 0 16px;
        }
        .fcx-section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }
        .fcx-rank-list {
            background: #1d1d1d;
            border-radius: 12px;
            padding: 6px 14px;
        }
        .fcx-rank-item {
            display: flex;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
        }
        .fcx-rank-item:last-child { border-bottom: none; }
        .fcx-rank-no {
            width: 30px;
            font-weight: 700;
            color: #ff6b3d;
        }
        .fcx-rank-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .fcx-rank-singer {
            color: #8a8a8a;
            font-size: 12px;
        }

        /* ============ 底部导航栏（字体图标版） ============ */
        .fcx-tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            display: flex;          /* 弹性布局：导航项自适应平分宽度 */
            align-items: stretch;
            z-index: 100;
        }
        .fcx-tab-item {
            flex: 1;                /* 每个导航项均分容器宽度 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: #8a8a8a;
            text-decoration: none;
        }
        /* 字体图标：用 font-size 控制大小、color 控制颜色 */
        .fcx-tab-item .fcx-iconfont {
            font-size: 24px;
            line-height: 1;
        }
        .fcx-tab-name {
            font-size: 11px;
            line-height: 1;
        }
        /* 选中状态：切换到番茄橙红色 */
        .fcx-tab-item.fcx-active {
            color: #ff6b3d;
        }
    </style>
</head>
<body>
    <!-- 页面头部 -->
    <div class="fcx-header">
        <div class="fcx-logo">番</div>
        <div class="fcx-title"><em>番茄</em>音乐</div>
    </div>

    <!-- 轮播 -->
    <div class="fcx-banner">周杰伦《太阳之子》MV上线</div>

    <!-- 热歌榜 -->
    <div class="fcx-section">
        <div class="fcx-section-title">热歌榜</div>
        <div class="fcx-rank-list">
            <div class="fcx-rank-item"><span class="fcx-rank-no">1</span><span class="fcx-rank-name">不死鸟</span><span class="fcx-rank-singer">霍尊·归一</span></div>
            <div class="fcx-rank-item"><span class="fcx-rank-no">2</span><span class="fcx-rank-name">问天</span><span class="fcx-rank-singer">江隐尘</span></div>
            <div class="fcx-rank-item"><span class="fcx-rank-no">3</span><span class="fcx-rank-name">起风了 (live版)</span><span class="fcx-rank-singer">买辣椒也用券</span></div>
        </div>
    </div>

    <!-- ============ 底部导航：字体图标（iconfont）实现 ============ -->
    <nav class="fcx-tabbar">
        <a href="#" class="fcx-tab-item fcx-active">
            <i class="fcx-iconfont">&#xe600;</i>
            <span class="fcx-tab-name">首页</span>
        </a>
        <a href="#" class="fcx-tab-item">
            <i class="fcx-iconfont">&#xe601;</i>
            <span class="fcx-tab-name">发现音乐</span>
        </a>
        <a href="#" class="fcx-tab-item">
            <i class="fcx-iconfont">&#xe602;</i>
            <span class="fcx-tab-name">歌单</span>
        </a>
        <a href="#" class="fcx-tab-item">
            <i class="fcx-iconfont">&#xe603;</i>
            <span class="fcx-tab-name">播放</span>
        </a>
        <a href="#" class="fcx-tab-item">
            <i class="fcx-iconfont">&#xe604;</i>
            <span class="fcx-tab-name">我的</span>
        </a>
    </nav>
</body>
</html>
