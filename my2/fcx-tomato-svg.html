<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄音乐 - 找歌页（SVG矢量图标版）</title>
    <style>
        /* ============ 全局 CSS（类名含姓名缩写 fcx，无 id 选择器） ============ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #121212;
            color: #e8e8e8;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            padding-bottom: 118px;
        }

        /* 顶部搜索栏 */
        .fcx-header {
            padding: 12px 14px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fcx-logo {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ff6b3d, #e6302c);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #fff;
            font-weight: bold;
            flex-shrink: 0;
        }
        .fcx-search {
            flex: 1;
            height: 34px;
            background: #1d1d1d;
            border-radius: 17px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            color: #8a8a8a;
            font-size: 13px;
        }
        .fcx-header-btn {
            font-size: 12px;
            color: #ff6b3d;
            flex-shrink: 0;
        }

        /* 顶部标签导航 */
        .fcx-tags {
            display: flex;
            gap: 18px;
            padding: 10px 16px 4px;
            overflow-x: auto;
            font-size: 15px;
        }
        .fcx-tags span {
            color: #8a8a8a;
            white-space: nowrap;
            padding-bottom: 4px;
        }
        .fcx-tags span.fcx-tag-active {
            color: #ff6b3d;
            font-weight: 700;
            border-bottom: 2px solid #ff6b3d;
        }

        /* 歌单分类卡片网格 */
        .fcx-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px 16px;
        }
        .fcx-card {
            border-radius: 12px;
            padding: 14px 14px 12px;
            min-height: 96px;
            position: relative;
            overflow: hidden;
            color: #fff;
        }
        .fcx-card .fcx-card-name {
            font-size: 16px;
            font-weight: 700;
        }
        .fcx-card .fcx-card-desc {
            font-size: 12px;
            margin-top: 6px;
            opacity: .85;
        }
        .fcx-card-c1 { background: linear-gradient(135deg, #7b2ff7, #c471ed); }
        .fcx-card-c2 { background: linear-gradient(135deg, #6b4226, #b98a5e); }
        .fcx-card-c3 { background: linear-gradient(135deg, #0f4c75, #3282b8); }
        .fcx-card-c4 { background: linear-gradient(135deg, #e6302c, #ff6b3d); }
        .fcx-card-c5 { background: linear-gradient(135deg, #1b1b3a, #4a4e69); }
        .fcx-card-c6 { background: linear-gradient(135deg, #1d3557, #457b9d); }
        .fcx-card-c7 { background: linear-gradient(135deg, #3a0ca3, #7209b7); }
        .fcx-card-c8 { background: linear-gradient(135deg, #b8860b, #ffd700); }
        .fcx-card-c9 { background: linear-gradient(135deg, #2b2d42, #8d99ae); }
        .fcx-card-c10 { background: linear-gradient(135deg, #5f0f40, #9a031e); }

        /* 底部播放栏 */
        .fcx-player {
            position: fixed;
            bottom: 64px;
            left: 0;
            width: 100%;
            height: 56px;
            background: #1d1d1d;
            border-top: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
            z-index: 90;
        }
        .fcx-player-name {
            flex: 1;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .fcx-player-btn {
            width: 20px;
            height: 20px;
            fill: #e8e8e8;
        }

        /* ============ 底部导航栏（SVG 矢量图标版） ============ */
        .fcx-tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            display: flex;
            align-items: stretch;
            z-index: 100;
        }
        .fcx-tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: #8a8a8a;
            text-decoration: none;
        }
        /* SVG 图标：width/height 控制大小，fill:currentColor 配合 color 控制颜色 */
        .fcx-svg-icon {
            width: 26px;
            height: 26px;
            fill: currentColor;
            overflow: hidden;
        }
        .fcx-tab-name {
            font-size: 11px;
            line-height: 1;
        }
        .fcx-tab-item.fcx-active {
            color: #ff6b3d;
        }
    </style>
</head>
<body>
    <!-- SVG symbol 图标定义（iconfont symbol 方式导出的内联图标库） -->
    <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
        <symbol id="fcx-icon-home" viewBox="0 0 24 24">
            <path d="M12 3L2 12h3v8h5v-5h4v5h5v-8h3L12 3z"></path>
        </symbol>
        <symbol id="fcx-icon-music" viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path>
        </symbol>
        <symbol id="fcx-icon-playlist" viewBox="0 0 24 24">
            <path d="M3 6h13v2H3V6zm0 5h13v2H3v-2zm0 5h8v2H3v-2zm16-6.5l4 3.5-4 3.5V9.5z"></path>
        </symbol>
        <symbol id="fcx-icon-play" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"></path>
        </symbol>
        <symbol id="fcx-icon-user" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
        </symbol>
    </svg>

    <!-- 顶部搜索栏 -->
    <div class="fcx-header">
        <div class="fcx-logo">番</div>
        <div class="fcx-search">搜索歌曲、歌手、专辑</div>
        <span class="fcx-header-btn">识曲 | 分类</span>
    </div>

    <!-- 顶部标签导航 -->
    <div class="fcx-tags">
        <span>推荐</span>
        <span>音乐</span>
        <span class="fcx-tag-active">找歌</span>
        <span>短剧</span>
        <span>听书</span>
        <span>视频</span>
    </div>

    <!-- 歌单分类卡片网格 -->
    <div class="fcx-grid">
        <div class="fcx-card fcx-card-c1"><div class="fcx-card-name">二次元音乐</div><div class="fcx-card-desc">用音符连接虚拟与现实</div></div>
        <div class="fcx-card fcx-card-c2"><div class="fcx-card-name">古风</div><div class="fcx-card-desc">感受东方诗意乐章</div></div>
        <div class="fcx-card fcx-card-c3"><div class="fcx-card-name">DJ</div><div class="fcx-card-desc">极具节奏感的洗脑神曲</div></div>
        <div class="fcx-card fcx-card-c4"><div class="fcx-card-name">抖音热门</div><div class="fcx-card-desc">火遍全网的热门歌曲</div></div>
        <div class="fcx-card fcx-card-c5"><div class="fcx-card-name">00后最爱</div><div class="fcx-card-desc">00后专属新生代潮流音乐</div></div>
        <div class="fcx-card fcx-card-c6"><div class="fcx-card-name">英语</div><div class="fcx-card-desc">超热门英文歌曲</div></div>
        <div class="fcx-card fcx-card-c7"><div class="fcx-card-name">纯音乐</div><div class="fcx-card-desc">耳朵里的温柔旋律</div></div>
        <div class="fcx-card fcx-card-c8"><div class="fcx-card-name">金曲</div><div class="fcx-card-desc">永不过时的经典之声</div></div>
        <div class="fcx-card fcx-card-c9"><div class="fcx-card-name">伤感</div><div class="fcx-card-desc">藏在歌词里的伤感心事</div></div>
        <div class="fcx-card fcx-card-c10"><div class="fcx-card-name">90年代</div><div class="fcx-card-desc">重温90年代流金岁月</div></div>
    </div>

    <!-- 底部播放栏 -->
    <div class="fcx-player">
        <svg class="fcx-player-btn" style="fill:#ff6b3d;"><use xlink:href="#fcx-icon-play"></use></svg>
        <span class="fcx-player-name">新-与天齐 (鼓点版)</span>
        <svg class="fcx-player-btn"><use xlink:href="#fcx-icon-playlist"></use></svg>
        <svg class="fcx-player-btn"><use xlink:href="#fcx-icon-music"></use></svg>
    </div>

    <!-- ============ 底部导航：SVG 矢量图标实现 ============ -->
    <nav class="fcx-tabbar">
        <a href="#" class="fcx-tab-item fcx-active">
            <svg class="fcx-svg-icon" aria-hidden="true"><use xlink:href="#fcx-icon-home"></use></svg>
            <span class="fcx-tab-name">首页</span>
        </a>
        <a href="#" class="fcx-tab-item">
            <svg class="fcx-svg-icon" aria-hidden="true"><use xlink:href="#fcx-icon-music"></use></svg>
            <span class="fcx-tab-name">发现音乐</span>
        </a>
        <a href="#" class="fcx-tab-item">
            <svg class="fcx-svg-icon" aria-hidden="true"><use xlink:href="#fcx-icon-playlist"></use></svg>
            <span class="fcx-tab-name">歌单</span>
        </a>
        <a href="#" class="fcx-tab-item">
            <svg class="fcx-svg-icon" aria-hidden="true"><use xlink:href="#fcx-icon-play"></use></svg>
            <span class="fcx-tab-name">播放</span>
        </a>
        <a href="#" class="fcx-tab-item">
            <svg class="fcx-svg-icon" aria-hidden="true"><use xlink:href="#fcx-icon-user"></use></svg>
            <span class="fcx-tab-name">我的</span>
        </a>
    </nav>
</body>
</html>
